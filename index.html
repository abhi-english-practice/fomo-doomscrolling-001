x-width:100%;text-align:left;overflow-wrap:anywhere;font-size:17px;padding:9px 12px}.answer:empty:before{content:'Tap the chunks to build your answer.';font-size:15px;color:var(--muted)}mark{background:var(--gold);color:var(--dark);font-weight:bold;border-radius:3px;padding:1px 2px}.feedback{margin-top:18px;border-radius:10px;background:var(--sage);padding:16px}.feedback.bad{background:#f4e5dc}.hint{background:var(--cream);border-radius:10px;padding:18px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.nav{border-top:1px solid var(--line);margin-top:26px;padding-top:20px}.progress{height:5px;background:var(--line);margin:16px 0}.progress span{display:block;height:100%;background:#927145}.finalcard{display:grid;grid-template-columns:280px 1fr;gap:25px;margin:20px 0}.finalcard img{width:100%;border-radius:10px}.finalcard details{border-bottom:1px solid var(--line);padding:12px 0}.finalcard summary{cursor:pointer;font-size:15px;display:list-item;margin-left:18px;color:var(--muted)}.finalq{font-size:18px;font-weight:bold;margin:7px 0}.explain{font-size:15px}.vi{color:#7b5c42;border-top:1px solid var(--line);padding-top:8px}footer{text-align:center;font-size:13px;color:var(--muted)}[hidden]{display:none!important}a{color:inherit}.score{font-size:14px;color:var(--muted)}@media(max-width:760px){header,main,footer{padding:18px}.layout,.finalcard{grid-template-columns:1fr}.panel{padding:17px}.question{font-size:22px}.top{align-items:flex-start}.finalcard img{max-width:420px}.steps{gap:6px}.steps button{font-size:13px;padding:9px}body{font-size:17px}}
</style></head><body><header><div class="top"><span class="brand">ABHI · UYEN / SPEAKING DOSSIER</span><span class="small">10 pictures · 3 levels · 210 Q&A</span></div><h1>FOMO &<br>Doomscrolling.</h1><p class="sub">One story. Three levels. Build it, say it, make it yours.</p><div class="tools"><div class="levels" role="group" aria-label="Level"><button data-level="A2">A2</button><button data-level="B1">B1</button><button data-level="B2+">B2+</button></div><button id="practice">Practice</button><button id="final">Final Q&A</button><button id="vi">VI · OFF</button><a id="teacher" href="Teacher_Guide.html" target="_blank">Teacher guide ↗</a></div><div class="tools"><label for="picture">Picture</label><select id="picture"></select><span id="score" class="score"></span><button id="reset">Reset this level</button></div></header><main><section id="practiceView"><div class="steps" aria-label="Practice step"><button data-step="1">1 · Build & Say</button><button data-step="2">2 · Look & Answer</button><button data-step="3">3 · Speak on Your Own</button></div><div class="progress"><span id="bar"></span></div><div class="layout"><div class="panel visual"><div class="label" id="sceneLabel"></div><img id="sceneImg" alt=""><div id="context" class="context"></div></div><div class="panel"><div class="label" id="taskLabel"></div><p class="question" id="question"></p><div id="task"></div><div id="feedback" aria-live="polite"></div></div></div><div class="nav"><button id="prev">← Previous</button><span id="position" class="small"></span><button id="next" class="primary">Next →</button></div></section><section id="finalView" hidden><div class="top"><div><div class="label">FINAL Q&A</div><h2>Look, answer, then check.</h2></div><button id="hideAll">Hide all answers</button></div><div class="tools"><label for="filter">Show pictures</label><select id="filter"><option value="all">All 10 pictures</option></select></div><div id="finalList"></div></section></main><footer>Designed by Abhi-Uyen</footer><script>const DATA=[{"id": "F01", "title": "Checking Again", "levels": {"A2": [{"id": "F01-A2-1", "group": "A", "q": "What is the woman doing?", "a": "She is checking her phone.", "chunks": ["She", "is checking", "her phone."], "hint": "check · phone", "useful": ["is checking"], "en": " For an action happening in the picture, use subject + am/is/are + -ing. For a description, be can take an adjective.", "vi": " Hành động trong tranh: chủ ngữ + am/is/are + V-ing. Khi miêu tả, be có thể đi với tính từ."}, {"id": "F01-A2-2", "group": "A", "q": "Where is she sitting?", "a": "She is sitting on a sofa.", "chunks": ["She", "is sitting", "on a sofa."], "hint": "sit · sofa", "useful": ["is sitting"], "en": " For an action happening in the picture, use subject + am/is/are + -ing. For a description, be can take an adjective.", "vi": " Hành động trong tranh: chủ ngữ + am/is/are + V-ing. Khi miêu tả, be có thể đi với tính từ."}, {"id": "F01-A2-3", "group": "A", "q": "What is beside her?", "a": "There is a book beside her.", "chunks": ["There is", "a book", "beside her."], "hint": "book · beside", "useful": ["There is"], "en": " For an action happening in the picture, use subject + am/is/are + -ing. For a description, be can take an adjective.", "vi": " Hành động trong tranh: chủ ngữ + am/is/are + V-ing. Khi miêu tả, be có thể đi với tính từ."}, {"id": "F01-A2-4", "group": "A", "q": "Does she seem interested in the book?", "a": "No, she seems more interested in her phone.", "chunks": ["No,", "she seems more interested", "in her phone."], "hint": "phone · more interested", "useful": ["she seems more interested"], "en": " Keep the subject before the verb in the answer. Match the verb tense to the story and keep each chunk together.", "vi": " Trong câu trả lời, đặt chủ ngữ trước động từ. Chọn thì phù hợp câu chuyện và giữ nguyên cụm từ."}, {"id": "F01-A2-5", "group": "B", "q": "When did this experience happen?", "a": "It happened a few months ago.", "chunks": ["It happened", "a few months", "ago."], "hint": "few months", "useful": ["It happened"], "en": " Keep the subject before the verb in the answer. Match the verb tense to the story and keep each chunk together.", "vi": " Trong câu trả lời, đặt chủ ngữ trước động từ. Chọn thì phù hợp câu chuyện và giữ nguyên cụm từ."}, {"id": "F01-A2-6", "group": "B", "q": "What did you often do in your free time?", "a": "I often checked my phone.", "chunks": ["I often", "checked", "my phone."], "hint": "often · check", "useful": ["I often"], "en": " Keep the subject before the verb in the answer. Match the verb tense to the story and keep each chunk together.", "vi": " Trong câu trả lời, đặt chủ ngữ trước động từ. Chọn thì phù hợp câu chuyện và giữ nguyên cụm từ."}, {"id": "F01-A2-7", "group": "B", "q": "Why did you check it so often?", "a": "I wanted to know what my friends were doing.", "chunks": ["I wanted", "to know", "what my friends were doing."], "hint": "know · friends", "useful": ["I wanted"], "en": " Keep the subject before the verb in the answer. Match the verb tense to the story and keep each chunk together.", "vi": " Trong câu trả lời, đặt chủ ngữ trước động từ. Chọn thì phù hợp câu chuyện và giữ nguyên cụm từ."}], "B1": [{"id": "F01-B1-1", "group": "A", "q": "What habit does the picture show?", "a": "She keeps checking her apps during her free time.", "chunks": ["She keeps", "checking her apps", "during her free time."], "hint": "apps · free time", "useful": ["checking her apps"], "en": " Keep the subject before the verb in the answer. Match the verb tense to the story and keep each chunk together.", "vi": " Trong câu trả lời, đặt chủ ngữ trước động từ. Chọn thì phù hợp câu chuyện và giữ nguyên cụm từ."}, {"id": "F01-B1-2", "group": "A", "q": "How does the book help us understand the scene?", "a": "The book is beside her, but she is paying attention to her phone.", "chunks": ["The book is beside her,", "but she is", "paying attention to her phone."], "hint": "book · attention", "useful": ["paying attention to"], "en": " Use pay attention to + a noun, person or -ing phrase. To is a preposition here.", "vi": " Dùng pay attention to + danh từ, người hoặc V-ing. To ở đây là giới từ."}, {"id": "F01-B1-3", "group": "A", "q": "Does she seem aware of everything around her?", "a": "She seems distracted because she is glued to her screen.", "chunks": ["She seems distracted", "because she is", "glued to her screen."], "hint": "distracted · screen", "useful": ["glued to her screen"], "en": " Use be glued to + a screen or device. Change the form of be to match the time and subject.", "vi": " Dùng be glued to + màn hình/thiết bị. Chia be theo thời điểm và chủ ngữ."}, {"id": "F01-B1-4", "group": "A", "q": "What might she want to find out?", "a": "She might want to keep up with her friends.", "chunks": ["She might want", "to keep up with", "her friends."], "hint": "updates · friends", "useful": ["keep up with"], "en": " Use keep up with + a person, topic or what-clause. A what-clause keeps subject-before-verb order.", "vi": " Dùng keep up with + người/chủ đề/mệnh đề what. Sau what giữ thứ tự chủ ngữ trước động từ."}, {"id": "F01-B1-5", "group": "B", "q": "Why did you keep checking your phone?", "a": "I kept checking my apps because I wanted to keep up with my friends.", "chunks": ["I kept checking my apps", "because I wanted", "to keep up with my friends."], "hint": "apps · friends", "useful": ["checking my apps", "keep up with"], "en": " Use keep up with + a person, topic or what-clause. A what-clause keeps subject-before-verb order.", "vi": " Dùng keep up with + người/chủ đề/mệnh đề what. Sau what giữ thứ tự chủ ngữ trước động từ."}, {"id": "F01-B1-6", "group": "B", "q": "When did you usually check it?", "a": "I usually checked my apps when I had some free time.", "chunks": ["I usually checked my apps", "when I had", "some free time."], "hint": "apps · free time", "useful": ["checked my apps"], "en": " Keep the subject before the verb in the answer. Match the verb tense to the story and keep each chunk together.", "vi": " Trong câu trả lời, đặt chủ ngữ trước động từ. Chọn thì phù hợp câu chuyện và giữ nguyên cụm từ."}, {"id": "F01-B1-7", "group": "B", "q": "What did you notice about this habit?", "a": "I noticed that I kept checking my phone without even realizing it.", "chunks": ["I noticed", "that I kept checking my phone", "without even realizing it."], "hint": "repeated checking · unaware", "useful": ["without even realizing it"], "en": " Keep the subject before the verb in the answer. Match the verb tense to the story and keep each chunk together.", "vi": " Trong câu trả lời, đặt chủ ngữ trước động từ. Chọn thì phù hợp câu chuyện và giữ nguyên cụm từ."}], "B2+": [{"id": "F01-B2+-1", "group": "A", "q": "What does her behaviour suggest about her use of technology?", "a": "She appears to be glued to her screen, with little awareness of her surroundings.", "chunks": ["She appears", "to be glued to her screen,", "with little awareness of her surroundings."], "hint": "screen · awareness", "useful": ["glued to her screen"], "en": " Use be glued to + a screen or device. Change the form of be to match the time and subject.", "vi": " Dùng be glued to + màn hình/thiết bị. Chia be theo thời điểm và chủ ngữ."}, {"id": "F01-B2+-2", "group": "A", "q": "Why is the untouched book significant?", "a": "It suggests that checking her apps is taking priority over an offline activity.", "chunks": ["It suggests", "that checking her apps", "is taking priority over an offline activity."], "hint": "apps · priorities", "useful": ["checking her apps"], "en": " For an action happening in the picture, use subject + am/is/are + -ing. For a description, be can take an adjective.", "vi": " Hành động trong tranh: chủ ngữ + am/is/are + V-ing. Khi miêu tả, be có thể đi với tính từ."}, {"id": "F01-B2+-3", "group": "A", "q": "How could an occasional check become difficult to notice?", "a": "Repeated checking can become automatic, so someone may do it without even realizing it.", "chunks": ["Repeated checking can become automatic,", "so someone may do it", "without even realizing it."], "hint": "repetition · automatic", "useful": ["without even realizing it"], "en": " After a modal such as could, might or should, use the base verb. Might/may marks an interpretation, not a certain fact.", "vi": " Sau động từ khuyết thiếu như could/might/should dùng động từ nguyên mẫu. Might/may đánh dấu điều suy đoán."}, {"id": "F01-B2+-4", "group": "A", "q": "What might motivate her to check for updates repeatedly?", "a": "A desire to keep up with other people may make her feel that she needs to stay connected twenty-four seven.", "chunks": ["A desire to keep up with other people", "may make her feel", "that she needs to stay connected twenty-four seven."], "hint": "updates · constant connection", "useful": ["keep up with", "stay connected twenty-four seven"], "en": " Use keep up with + a person, topic or what-clause. A what-clause keeps subject-before-verb order.", "vi": " Dùng keep up with + người/chủ đề/mệnh đề what. Sau what giữ thứ tự chủ ngữ trước động từ."}, {"id": "F01-B2+-5", "group": "B", "q": "How did checking your phone become an automatic habit?", "a": "I was constantly looking at my phone, often without even realizing it, just to keep up with what people were up to.", "chunks": ["I was constantly looking at my phone,", "often without even realizing it,", "just to keep up with what people were up to."], "hint": "automatic · updates", "useful": ["without even realizing it", "constantly looking at my phone", "keep up with what people were up to", "keep up with"], "en": " Use keep up with + a person, topic or what-clause. A what-clause keeps subject-before-verb order.", "vi": " Dùng keep up with + người/chủ đề/mệnh đề what. Sau what giữ thứ tự chủ ngữ trước động từ."}, {"id": "F01-B2+-6", "group": "B", "q": "What made this habit seem harmless at first?", "a": "I saw checking my apps as a way to stay connected, rather than as something that could dominate my free time.", "chunks": ["I saw checking my apps", "as a way to stay connected,", "rather than as something that could dominate my free time."], "hint": "apps · connection · free time", "useful": ["checking my apps"], "en": " After a modal such as could, might or should, use the base verb. Might/may marks an interpretation, not a certain fact.", "vi": " Sau động từ khuyết thiếu như could/might/should dùng động từ nguyên mẫu. Might/may đánh dấu điều suy đoán."}, {"id": "F01-B2+-7", "group": "B", "q": "How would you describe the habit with hindsight?", "a": "Looking back, I was glued to my screen without even realizing how often I checked it.", "chunks": ["Looking back,", "I was glued to my screen", "without even realizing how often I checked it."], "hint": "reflection · screen · frequency", "useful": ["glued to my screen"], "en": " Use be glued to + a screen or device. Change the form of be to match the time and subject.", "vi": " Dùng be glued to + màn hình/thiết bị. Chia be theo thời điểm và chủ ngữ."}]}, "alt": "A woman on a sofa checks her phone; a closed book and cup sit on the side table.", "context": "The narrator noticed this habit a few months ago. She often checked her phone during her free time."}, {"id": "F02", "title": "Everyone Else Is Having Fun", "levels": {"A2": [{"id": "F02-A2-1", "group": "A", "q": "What is she looking at?", "a": "She is looking at her friends’ photos.", "chunks": ["She is looking at", "her friends’", "photos."], "hint": "friends · photos", "useful": ["She is looking at"], "en": " For an action happening in the picture, use subject + am/is/are + -ing. For a description, be can take an adjective.", "vi": " Hành động trong tranh: chủ ngữ + am/is/are + V-ing. Khi miêu tả, be có thể đi với tính từ."}, {"id": "F02-A2-2", "group": "A", "q": "What are some of her friends doing in the photos?", "a": "They are enjoying a concert together.", "chunks": ["They are enjoying", "a concert", "together."], "hint" const $=id=>document.getElementById(id);let level='A2',pic=0,step=1,group='A',qi=0,mode='practice',vi=false,selected=[],bank=[],solved=false,filter='all';const KEY='abhi-fomo-three-levels-v1';let scores={};try{scores=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};for(const l of ['A2','B1','B2+'])scores[l]??={built:[],spoken:[]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(scores))}catch{}}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function marked(text,q){const terms=[...q.useful].filter(Boolean).sort((a,b)=>b.length-a.length);let out='',i=0;while(i<text.length){let t=terms.find(t=>text.slice(i,i+t.length).toLowerCase()===t.toLowerCase());if(t){out+='<mark>'+esc(text.slice(i,i+t.length))+'</mark>';i+=t.length}else{out+=esc(text[i]);i++}}return out}function qnow(){return DATA[pic].levels[level].filter(q=>q.group===group)[qi]}function shuffle(a){let v=a.map((text,i)=>({text,i}));for(let i=v.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]]}if(v.every((x,i)=>x.i===i)&&v.length>1)v.push(v.shift());return v}function sound(ok){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();let osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.setValueAtTime(ok?660:220,ctx.currentTime);if(ok)osc.frequency.setValueAtTime(880,ctx.currentTime+.1);gain.gain.setValueAtTime(.06,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.23);osc.start();osc.stop(ctx.currentTime+.24);osc.onended=()=>ctx.close()}catch{}}
function explanation(q){return '<p class="explain">'+esc(q.en)+'</p>'+(vi?'<p class="explain vi">'+esc(q.vi)+'</p>':'')}function updateScores(){$('score').textContent='Built '+scores[level].built.length+'/70 · Self-practice '+scores[level].spoken.length+'/140'}function addUnique(type,id){if(!scores[level][type].includes(id))scores[level][type].push(id);save();updateScores()}
function drawBuilder(){const q=qnow();$('task').innerHTML='<div class="answer" id="answer"></div><div class="bank" id="bank"></div><div class="controls"><button id="check" class="primary">Check answer</button><button id="clear">Clear</button><button id="again">Shuffle</button></div>';for(const item of selected){let b=document.createElement('button');b.innerHTML=marked(item.text,q);b.title='Return chunk';b.onclick=()=>{selected=selected.filter(x=>x.i!==item.i);solved=false;$('feedback').innerHTML='';drawBuilder()};$('answer').append(b)}for(const item of bank.filter(x=>!selected.some(y=>y.i===x.i))){let b=document.createElement('button');b.innerHTML=marked(item.text,q);b.onclick=()=>{selected.push(item);solved=false;$('feedback').innerHTML='';drawBuilder()};$('bank').append(b)}$('check').disabled=selected.length!==q.chunks.length;$('check').onclick=()=>{let actual=selected.map(x=>x.text).join(' ');let ok=actual===q.a;solved=ok;sound(ok);if(ok)addUnique('built',q.id);$('feedback').innerHTML='<div class="feedback '+(ok?'':'bad')+'">'+(ok?'<strong>✓ Well built.</strong><p>'+marked(q.a,q)+'</p>':'<strong>Try another order.</strong><p class="explain">Keep each chunk together and follow the question’s tense.</p>')+explanation(q)+'</div>'};$('clear').onclick=()=>{selected=[];$('feedback').innerHTML='';drawBuilder()};$('again').onclick=()=>{selected=[];bank=shuffle(q.chunks);$('feedback').innerHTML='';drawBuilder()}}
function render(){document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',b.dataset.level===level));$('vi').textContent='VI · '+(vi?'ON':'OFF');$('practice').classList.toggle('active',mode==='practice');$('final').classList.toggle('active',mode==='final');$('practiceView').hidden=mode!=='practice';$('finalView').hidden=mode!=='final';$('teacher').hidden=mode==='practice'&&step===3;$('picture').value=pic;updateScores();if(mode==='final'){drawFinal();return}const s=DATA[pic],q=qnow();document.querySelectorAll('[data-step]').forEach(b=>b.classList.toggle('active',+b.dataset.step===step));$('sceneImg').src='scene-'+String(pic+1).padStart(2,'0')+'.jpg';$('sceneImg').alt=s.alt;$('sceneLabel').textContent=s.id+' / '+s.title;$('context').hidden=step===3;$('context').textContent=s.context;$('taskLabel').textContent=(group==='A'?'A · Understand the picture':'B · Tell the story — speak as “I”')+' / '+(qi+1)+' of '+(group==='A'?4:3);$('question').textContent=q.q;$('feedback').innerHTML='';$('position').textContent='Picture '+(pic+1)+' / 10 · Step '+step+' / 3';$('bar').style.width=((pic*21+(group==='B'?12:0)+(step-1)*(group==='A'?4:3)+qi+1)/210*100)+'%';if(step===1){selected=[];bank=shuffle(q.chunks);solved=false;drawBuilder()}else{$('task').innerHTML=(step===2?'<p class="hint">'+esc(q.hint)+'</p>':'<p class="small">Answer aloud in your own words.</p>')+'<div class="controls"><button id="said" class="primary">I said it</button></div>';$('said').textContent=scores[level].spoken.includes(q.id+'-'+step)?'✓ I said it':'I said it';$('said').onclick=()=>{addUnique('spoken',q.id+'-'+step);$('said').textContent='✓ I said it'}}$('prev').disabled=pic===0&&group==='A'&&step===1&&qi===0;$('next').textContent=pic===9&&group==='B'&&step===3&&qi===2?'Final Q&A →':'Next →'}
function drawFinal(){$('filter').value=filter;$('finalList').innerHTML='';DATA.forEach((s,i)=>{if(filter!=='all'&&+filter!==i)return;let article=document.createElement('article');article.className='panel finalcard';article.innerHTML='<div><img src="scene-'+String(i+1).padStart(2,'0')+'.jpg" alt="'+esc(s.alt)+'"><h2>'+esc(s.title)+'</h2></div><div>'+s.levels[level].map(q=>'<div><p class="finalq">'+esc(q.q)+'</p><details><summary>Show answer</summary><p>'+marked(q.a,q)+'</p>'+explanation(q)+'</details></div>').join('')+'</div>';$('finalList').append(article)})}
function next(){const count=group==='A'?4:3;if(qi<count-1){qi++}else{qi=0;if(step<3)step++;else{step=1;if(group==='A')group='B';else{group='A';if(pic<9)pic++;else mode='final'}}}render()}function prev(){if(qi>0)qi--;else if(step>1){step--;qi=group==='A'?3:2}else if(group==='B'){group='A';step=3;qi=3}else if(pic>0){pic--;group='B';step=3;qi=2}render()}
DATA.forEach((s,i)=>{for(const id of ['picture','filter']){let o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' · '+s.title;$(id).append(o)}});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;step=1;group='A';qi=0;render()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;qi=0;render()});$('picture').onchange=()=>{pic=+$('picture').value;step=1;group='A';qi=0;mode='practice';render()};$('filter').onchange=()=>{filter=$('filter').value;drawFinal()};$('practice').onclick=()=>{mode='practice';render()};$('final').onclick=()=>{mode='final';render()};$('vi').onclick=()=>{vi=!vi;render()};$('hideAll').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);$('next').onclick=next;$('prev').onclick=prev;$('reset').onclick=()=>{if(confirm('Reset progress for '+level+' only?')){scores[level]={built:[],spoken:[]};save();render()}};render();
